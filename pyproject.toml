[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rwe"
version = "0.1.0"
description = "Random Walks with Erasure: diversifying personalized recommendations on social and information networks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Implementation of Paudel & Bernstein (WWW'21)" }]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "networkx>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "fastapi>=0.110", "httpx>=0.27", "sqlalchemy>=2.0"]
leiden = ["leidenalg>=0.9", "python-igraph>=0.10"]
docs = ["matplotlib>=3.5", "python-pptx>=0.6", "pillow>=9.0"]
# Production serving layer (examples/api_fastapi.py) + the beta product store
# (examples/store.py). The research pipeline and the stdlib demo server
# (examples/api_server.py) need none of this.
serve = ["fastapi>=0.110", "uvicorn>=0.30", "sqlalchemy>=2.0",
         # Web Push (Phase B2). Imported lazily by examples/push_sender.py so the engine — and the
         # whole test suite — still load where its native dependency (http-ece) cannot be built.
         "pywebpush>=1.14",
         # `zoneinfo` reads the SYSTEM tz database, which a slim base image may not carry — and a
         # missing one is silent: every zone lookup fails and reader-local day bucketing degrades
         # back to UTC, which is the exact bug it exists to fix. This wheel is the documented
         # fallback source, so the engine stops depending on what the base image happens to ship.
         "tzdata>=2024.1"]

[tool.setuptools.packages.find]
include = ["rwe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` covers the wall-clock probes in tests/concurrency (busy_timeout expiry, pool exhaustion).
# They are excluded by default and run with `pytest -m slow tests/concurrency`; everything else in
# that directory runs with the normal suite, so CI's 3.11 + 3.12 matrix exercises the version-drift
# detectors documented in docs/IDENTITY_UPSERT_CONCURRENCY.md §10.
addopts = "-m 'not slow'"
markers = [
  "concurrency: storage-level concurrency + version-drift harness (tests/concurrency)",
  "slow: needs seconds of wall clock; excluded by default",
]
