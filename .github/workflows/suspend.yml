# Suspend Environment — stop paying for compute without losing anything.
#
# Manual only, approval-gated (the `production` environment), and guarded by a typed confirmation.
# It STOPS the instance; it never terminates anything and never runs `terraform destroy`. The root
# EBS volume — which holds the SQLite database, the Docker images, and Caddy's certificates — stays
# attached to the stopped instance, and the Elastic IP stays associated, so DNS and TLS survive the
# suspension untouched. See docs/SUSPEND_RESUME.md for why stop beats destroy on this architecture.
#
# Sequence: host-side suspend.sh (final integrity-checked backup → off-host to S3 → graceful
# container stop) and ONLY THEN the control-plane stop. A failed backup aborts before anything stops.
name: Suspend Environment

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SUSPEND to confirm (the app will stop serving)'
        required: true

concurrency:
  group: lifecycle-production # never a suspend and a resume/deploy at once
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  suspend:
    name: Suspend production
    runs-on: ubuntu-latest
    environment: production # approval gate + deployment history
    timeout-minutes: 20
    steps:
      - name: Check the typed confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "SUSPEND" ]; then
            echo "::error::confirmation text did not match — expected SUSPEND. Nothing was done."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Quiesce the application (backup → integrity → off-host → graceful stop)
        id: quiesce
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "suspend (run ${{ github.run_id }})" \
            --timeout-seconds 900 \
            --parameters "commands=[\"cd /opt/ih && SUSPEND_ACTOR='${{ github.actor }}' bash deploy/ops/suspend.sh 2>&1\"]" \
            --query 'Command.CommandId' --output text)
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; *) sleep 10 ;; esac
          done
          OUT=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query 'StandardOutputContent' --output text)
          printf '%s\n' "$OUT" | tail -40
          if ! printf '%s' "$OUT" | grep -q 'SUSPEND_RESULT=ready'; then
            echo "::error::the host refused to suspend (see output above — most likely the pre-suspend backup failed). The app is STILL SERVING and the instance was NOT stopped."
            exit 1
          fi

      - name: Stop the instance
        run: |
          aws ec2 stop-instances --instance-ids "${{ vars.EC2_INSTANCE_ID }}" >/dev/null
          echo "waiting for the instance to reach 'stopped'…"
          aws ec2 wait instance-stopped --instance-ids "${{ vars.EC2_INSTANCE_ID }}"
          aws ec2 describe-instances --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --query 'Reservations[0].Instances[0].{State:State.Name,Volumes:BlockDeviceMappings[*].Ebs.VolumeId}' \
            --output table

      - name: Summary
        run: |
          {
            echo "### Environment suspended :white_check_mark:"
            echo ""
            echo "* Instance \`${{ vars.EC2_INSTANCE_ID }}\` is **stopped** — compute billing has ended."
            echo "* Root EBS volume (database, images, TLS certs) is **preserved and still attached**."
            echo "* Elastic IP, Route 53, S3 backups, Terraform state, and \`deploy/.env\` secrets are **untouched**."
            echo "* A final integrity-checked backup was shipped off-host before the stop."
            echo ""
            echo "Cost while suspended: roughly **\$7-8/month** (EBS + public IPv4 + hosted zone + S3)."
            echo ""
            echo "Bring it back with the **Resume Environment** workflow."
          } >> "$GITHUB_STEP_SUMMARY"
