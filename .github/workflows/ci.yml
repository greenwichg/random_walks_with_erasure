# Continuous Integration — verifies every pull request (and pushes to the default branch).
#
# Jobs run in parallel; the `ci-success` gate depends on all of them, so branch protection only
# needs to require that one check. Additive: it runs the repository's EXISTING test/build/typecheck
# commands (pytest, tsc --noEmit, next build, node --test) — no application code is changed.
name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"] # dev/prod target + next version (requires-python >= 3.9)
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip # cache the pip download/wheel cache
          cache-dependency-path: pyproject.toml
      - name: Install (engine + test extras)
        run: pip install -e ".[test,serve]"
      - name: Run pytest
        run: python -m pytest --junitxml=pytest-report.xml -q
      - name: Upload test report
        if: always() # keep the report even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: pytest-report.xml
          if-no-files-found: ignore

  web:
    name: Web typecheck + tests + build
    runs-on: ubuntu-latest
    # npm workspaces: the install and the lockfile are at the repo ROOT, and each step names the
    # workspace it runs in. `working-directory: web` at the job level would break `npm ci`, which
    # must see the root lockfile.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 runs the TypeScript unit suite directly (native type stripping), so `npm test`
          # (the .test.ts files) is gated in CI, not just the two .mjs files it ran before.
          node-version: "22"
          cache: npm # cache ~/.npm keyed on the lockfile
          cache-dependency-path: package-lock.json
      - name: Install (clean, from lockfile — the whole workspace)
        run: npm ci
      - name: Shared core — platform-independence guard
        # FIRST, and deliberately so. Everything below can pass with a React import sitting in
        # @ih/core: tsc resolves it, webpack bundles it, the web tests exercise it. The only thing
        # that catches it is this, and it is worthless if it runs after a green build convinces
        # somebody the change is fine.
        run: npm test --workspace @ih/core
      - name: Shared core — typecheck (no DOM lib)
        run: npm run typecheck --workspace @ih/core
      - name: Mobile — boundary guard + design tokens
        # Before the web build, for the same reason the core guard runs first: everything after this
        # can pass with a `next/server` import sitting in mobile/, because tsc resolves it happily
        # and only Metro would object — on a device, later.
        run: npm test --workspace @ih/mobile
      - name: Mobile — typecheck
        run: npm run typecheck --workspace @ih/mobile
      - name: Typecheck
        run: npm run typecheck --workspace web
      - name: Lint
        run: npm run lint --workspace web
      - name: i18n catalog parity
        run: npm run check:i18n --workspace web
      - name: Frontend unit tests (logic suite)
        run: npm test --workspace web
      - name: Frontend unit tests (env validation + security headers)
        working-directory: web
        run: node --test lib/*.test.mjs
      - name: Production build
        run: npm run build --workspace web 2>&1 | tee web-build.log
      - name: Verify build artifact
        run: test -f web/.next/BUILD_ID && echo "web build artifact present ($(cat web/.next/BUILD_ID))"
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-log
          path: web-build.log
          if-no-files-found: ignore

  extension:
    name: Extension tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The extension is dependency-free (no package.json); its pure logic is run with node --test.
      - name: Run extension tests
        run: node --test extension/common.test.js

  e2e:
    name: Playwright e2e (real engine + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install engine (the e2e webServer boots the real FastAPI engine)
        run: pip install -e ".[serve]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install web deps (workspace root)
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run e2e (builds the app, boots engine + web, drives the real stack)
        working-directory: web
        run: npm run e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/.e2e-tmp/report
          if-no-files-found: ignore

  docker:
    name: Docker builds + compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate docker-compose (incl. the backup-scheduler profile)
        run: |
          docker compose -f deploy/docker-compose.yml config -q
          docker compose -f deploy/docker-compose.yml --profile scheduler config -q
          docker compose -f deploy/docker-compose.yml --profile backup config -q
      - name: Validate the AWS production override (base + override merge)
        # Dummy secrets satisfy the override's fail-fast ${VAR:?} guards so `config` can render the
        # merged model (this validates the !reset/!override tags + interpolation, not the secrets).
        run: |
          RWE_INTERNAL_SECRET=ci NEXTAUTH_URL=https://ci.example.com NEXTAUTH_SECRET=ci \
          GOOGLE_CLIENT_ID=ci GOOGLE_CLIENT_SECRET=ci BETA_ALLOWLIST=ci@example.com \
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.aws.yml config -q
      - name: Validate deployment-dependency wiring (drift guard)
        # Fails the build if a service DECLARES a capability (e.g. RWE_FEED_POLL=1) without the env vars,
        # bind mounts, secrets, or config files it DEPENDS ON — the class of drift behind the 2026-07-21
        # ingestion incident. Rules are data (deploy/deployment-rules.json); the script supplies its own
        # dummy secrets, so no CI secrets are needed. See docs/DEPLOYMENT_RUNBOOK.md.
        run: python3 deploy/ops/validate-deployment.py
      - name: Lint the ops scripts (syntax)
        run: bash -n deploy/ops/*.sh
      - name: Build engine image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: false
          load: false
          tags: ih-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: false
          load: false
          tags: ih-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # Single aggregate check for branch protection: require "CI success" and it fans in the rest.
  ci-success:
    name: CI success
    if: always()
    needs: [python, web, extension, e2e, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        run: |
          echo "python=${{ needs.python.result }} web=${{ needs.web.result }} extension=${{ needs.extension.result }} e2e=${{ needs.e2e.result }} docker=${{ needs.docker.result }}"
          test "${{ needs.python.result }}" = "success" \
            && test "${{ needs.web.result }}" = "success" \
            && test "${{ needs.extension.result }}" = "success" \
            && test "${{ needs.e2e.result }}" = "success" \
            && test "${{ needs.docker.result }}" = "success"
