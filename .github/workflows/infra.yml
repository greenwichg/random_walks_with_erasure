# Infrastructure CI — format + validity gates for terraform/ on every change that touches it.
#
# Deliberately CREDENTIAL-FREE: `init -backend=false` + `validate` check syntax, provider schemas,
# and internal references without touching remote state or AWS. Plan and apply intentionally stay
# with the MFA-gated human operator flow (terraform/README.md → assume.sh): the repo's security
# doctrine is that state-touching Terraform runs require MFA, which CI cannot present — so CI gates
# what it can prove offline and the runbook (docs/CICD_PIPELINE.md) covers the rest.
name: Infra

on:
  pull_request:
    paths: ["terraform/**"]
  push:
    branches: [main, master]
    paths: ["terraform/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-checks:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
      - name: Format check
        run: terraform fmt -check -diff -recursive
      - name: Init (no backend — no state, no credentials)
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate -no-color
