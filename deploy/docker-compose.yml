      # clusterer, so it gates the blindspot claim and demotes suspect clusters out of the default
      # ranking — single-linkage chaining accumulates publishers, which means a false merge's
      # wrongness and its rank had the same cause. A score is only acted on with 4+ located members
      # behind it; TRUST_RANKING=0 restores pure size ordering without a deploy.
      RWE_STORY_COHERENCE_FLOOR: ${RWE_STORY_COHERENCE_FLOOR:-0.7}
      RWE_STORY_UNVERIFIED_SIZE: ${RWE_STORY_UNVERIFIED_SIZE:-50}
      RWE_STORY_TRUST_RANKING: ${RWE_STORY_TRUST_RANKING:-1}
      # Cluster-aware linkage. GLOBAL (LINK_QUORUM) is ON at 0.2 — adopted and twice verified
      # against the live catalog (docs/STORY_CLUSTER_QUORUM_VERIFICATION.md, ~35.8k articles):
      # loose members -88%, chain depth >= 5 -93%, largest cluster 196 -> 67, mean coherence
      # 0.922 -> 0.932, blindspot claims +15 — and grouping IMPROVED, because cleaner primary
      # clusters give the description-based merge pass joinable inputs. The cost is a measured
      # -5.5% of covered articles, about half of it template-blob deflation.
      #
      # An earlier note here recorded the OPPOSITE conclusion from a 16,921-article measurement
