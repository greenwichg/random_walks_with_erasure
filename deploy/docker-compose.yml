      # edge must share >= 1 token outside the announcement-template lexicon — the entertainment
      # template chain's fix ("X-Men cast/release-date" welded to The Paper/Mirzapur/DJI over
      # {cast, date, release, revealed/trailer/...}, zero distinctive tokens). Phase B on the
      # live catalog: all ten pre-registered bars passed — the weld resolves into the genuine
