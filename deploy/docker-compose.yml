# Complete system: FastAPI engine + Next.js web app.
#   docker compose -f deploy/docker-compose.yml up --build
# Then open http://localhost:3000  (API docs at http://localhost:8000/docs).
services:
  api:
    build:
      context: ..                      # repo root
      dockerfile: deploy/Dockerfile.api
    ports:
      # Loopback-only publish: the engine is never on the box's public interface. Dev still reaches it
      # at http://127.0.0.1:8000; the AWS prod override unpublishes it entirely (only Caddy, over the
      # private Docker network, can reach it). Inter-container calls use the `api` service name, so this
      # host publish is for local debugging only and does not affect web→engine traffic.
      - "127.0.0.1:8000:8000"
    environment:
      RWE_PROFILE: synthetic           # synthetic | qbias | mind | politosphere
      RWE_LOG_LEVEL: INFO
      # Live recommendation source: the `ingest` service (below) fills the FeedArticle catalog from
      # real RSS feeds, and this flag makes the engine source recommendations from it — so each
      # recommendation carries the real publisher URL and the web app's "Read" opens the article. If
      # the catalog ends up below RWE_FEED_MIN_ARTICLES (feeds unreachable), the engine falls back to
      # RWE_PROFILE above. Comment this out to always use the static corpus (recommendations, no URLs).
      RWE_RECS_SOURCE: feed
      # Cap articles per outlet in the recommendation corpus so one high-volume ("firehose") feed can't
      # dominate the recommendations. 0/unset = no cap. The full catalog is unaffected.
      RWE_FEED_MAX_PER_OUTLET: 40
      # Keep the FeedArticle catalog fresh in the background (reuses the ingest pipeline, deduped).
      # The one-shot `ingest` service seeds the initial catalog; this re-polls every RWE_POLL_INTERVAL
      # (default 600s). Tune with RWE_POLL_INTERVAL / RWE_POLL_TIMEOUT / RWE_POLL_RETRIES.
      RWE_FEED_POLL: 1
      # The background poller resolves its feeds from RWE_RSS_FEEDS — the SAME list the `ingest` service
      # uses. WITHOUT this (and the matching mount below) the poller loads ZERO feeds and silently no-ops,
      # so the catalog only ever refreshes at `up` time. Keep this pair in sync with the ingest service.
      RWE_RSS_FEEDS: /app/feeds/rss_feeds.txt
      # --- GDELT ingestion (keyless; adapter already registered in default_registry) — OFF by default -
      # A SECOND live source, wired but disabled. Enable a controlled trial via RWE_GDELT_ENABLED=1 in
      # deploy/.env; the MultiSourcePoller picks it up with NO scheduler change (docs/GDELT_TRIAL_RUNBOOK.md).
      # Conservative caps below. GDELT is high-volume + mostly unknown-outlet (searchable but NOT
      # recommendable — no-lean rows drop from the qbias corpus; see docs/CORPUS_ARCHITECTURE.md), so
      # RWE_RETENTION_MAX_COUNT bounds catalog growth (retention is OFF unless a count/age cap is set).
      RWE_GDELT_ENABLED: ${RWE_GDELT_ENABLED:-0}
      RWE_GDELT_QUERY: ${RWE_GDELT_QUERY:-}
      RWE_GDELT_MAX_ARTICLES: ${RWE_GDELT_MAX_ARTICLES:-25}
      RWE_GDELT_POLL_INTERVAL: ${RWE_GDELT_POLL_INTERVAL:-1800}
      # Read timeout for the DOC endpoint. It was absent here and defaulted to 15 s in code, which
      # is the single reason the adapter sat at a 58% success rate. Measured live 2026-07-27:
      #   429 refusals  9.4 - 12.7 s   |   200 successes  13.5, 14.7, 15.3 s
      # GDELT answers slowly either way and REFUSES FASTER THAN IT SUCCEEDS, so a 15 s timeout cut
      # off successes while letting every refusal through. Query complexity is not a factor — a
      # single-term query measured 15.3 s and 429'd at the same rate. Do not lower this below ~30 s
      # without re-measuring the distribution; the failure it causes looks like a rate limit.
      RWE_GDELT_TIMEOUT: ${RWE_GDELT_TIMEOUT:-45}
      # GKG event-geography enricher (Location Intelligence Phase 2): locates articles ALREADY in
      # the catalog from GDELT's GKG files — the supply behind the event-location Country filter.
      # Default 1 = ON (launch decision: without it the Country filter has no data and pickers
      # stay empty). Kill switch: RWE_GDELT_GKG=0 in deploy/.env + restart. Enrichment only —
      # it never creates articles, so RWE_RETENTION_* sizing is unaffected.
      RWE_GDELT_GKG: ${RWE_GDELT_GKG:-1}
      RWE_GDELT_GKG_INTERVAL: ${RWE_GDELT_GKG_INTERVAL:-900}
      # Steady-state lookback per cycle (15-min GKG windows; default 4 = 1 h): catalog articles
      # were processed by GDELT in EARLIER windows, so the latest file alone would almost never
      # match. The cold-start backfill is AUTOMATIC: a barely-located catalog (< BACKFILL_THRESHOLD
      # event rows, default 25) makes the first cycle per process deep (BACKFILL_WINDOWS,
      # default 96 = 24 h; 0 disables) — no manual override/revert dance.
      # WINDOWS is a PER-CYCLE DOWNLOAD COUNT (N windows = N+1 requests every cycle, each a multi-MB
      # zip). Leaving it at the backfill depth 96 is ~9,300 requests/day and rate-limited the DOC
      # adapter to a 60% success rate — see docs/GDELT_RATE_LIMIT_INVESTIGATION.md. Cold start is
      # automatic via BACKFILL_WINDOWS; never copy that value here.
      RWE_GDELT_GKG_WINDOWS: ${RWE_GDELT_GKG_WINDOWS:-4}
      RWE_GDELT_GKG_BACKFILL_WINDOWS: ${RWE_GDELT_GKG_BACKFILL_WINDOWS:-96}
      # --- Publisher metadata enrichment (Wikipedia + Wikidata) ---------------------------------
      # Fills the logo / description / founded / HQ / parent gaps the curated registry leaves, so
      # the Publisher page renders complete profiles. Curated data is NEVER overwritten — enrichment
      # only fills empty fields, and each one carries its source (docs/PUBLISHER_METADATA.md).
      # REQUEST BUDGET (the number to check before raising anything): one publisher costs 2-4
      # requests, BATCH publishers run per cycle, one cycle per INTERVAL seconds. At the defaults
      # that is 5 x 4 = 20 requests per 15 min = ~1,920/day worst case, and far less in steady state
      # because a publisher whose row is still fresh is skipped WITHOUT a request — once the catalog
      # is covered a cycle costs one SQL query and zero HTTP. TTLs are 30 days for a match or a
      # confirmed miss, 14 for ambiguous, 6 hours for an error.
      # Wikimedia's User-Agent policy requires a contact address; RWE_WIKI_CONTACT supplies it.
      RWE_PUBLISHER_WIKI: ${RWE_PUBLISHER_WIKI:-1}
      RWE_PUBLISHER_WIKI_BATCH: ${RWE_PUBLISHER_WIKI_BATCH:-5}
      RWE_PUBLISHER_WIKI_INTERVAL: ${RWE_PUBLISHER_WIKI_INTERVAL:-900}
      RWE_WIKI_CONTACT: ${RWE_WIKI_CONTACT:-https://hidden-view.com}
      # --- shared HTTP resilience (every provider, not just GDELT) ------------------------------
      # Retries cover 5xx AND connection-level faults (SSL handshake, DNS, connect/read timeout,
      # reset) with exponential backoff + half-jitter. 429 is NOT retried on a ladder — a rate limit
      # is retried only when the server sends a Retry-After we will wait for, else the next
      # scheduled cycle handles it. A failing provider's interval doubles per consecutive failure
      # (BACKOFF_STEPS caps the doubling, MAX_INTERVAL the result) and snaps back on first success.
      RWE_SOURCE_RETRIES: ${RWE_SOURCE_RETRIES:-3}
      RWE_SOURCE_BACKOFF: ${RWE_SOURCE_BACKOFF:-5}
      RWE_SOURCE_RETRY_AFTER_MAX: ${RWE_SOURCE_RETRY_AFTER_MAX:-120}
      # Total seconds ONE request may spend sleeping across all its retries. Retry count and the
      # per-wait ceiling do not bound wall-clock time between them: 3 retries x a 120 s Retry-After
      # is six minutes of one poller thread held by a single polite server. This makes the worst
      # case a number you can read instead of a product of three knobs.
      RWE_SOURCE_MAX_WAIT: ${RWE_SOURCE_MAX_WAIT:-60}
      # Failure backoff. AFTER is how many consecutive failures before the interval widens at all;
      # STEPS caps the doubling. Both were tightened after gdelt://doc reached 7 consecutive
      # failures and the old 16x ladder pinned its 30-minute interval at the 6-hour ceiling —
      # taking a source that succeeds ~58% of the time from ~28 ingests/day to ~2. Doubling on
      # consecutive failures assumes failures are CORRELATED; GDELT's are load shedding and land
      # independently, so runs arrive by chance. consecutive_failures is persisted, so a restart
      # does not clear a ratchet — only a success does.
      RWE_SOURCE_BACKOFF_AFTER: ${RWE_SOURCE_BACKOFF_AFTER:-3}
      RWE_SOURCE_BACKOFF_STEPS: ${RWE_SOURCE_BACKOFF_STEPS:-2}
      RWE_SOURCE_MAX_INTERVAL: ${RWE_SOURCE_MAX_INTERVAL:-21600}
      # NewsAPI adapter (same shared pipeline as RSS/GDELT: dedup, scoring, registry resolution,
      # clustering). Default OFF — enable with RWE_NEWSAPI_ENABLED=1 + RWE_NEWSAPI_API_KEY in
      # deploy/.env. CATEGORY/COUNTRY/LANGUAGE accept comma-separated lists, polled by ROTATION
      # (one combination per cycle — N combos never multiply the request rate). The free tier is
      # ~100 requests/day and the 900 s interval spends 96, so the DAILY_BUDGET default (90)
      # leaves headroom; the budget short-circuits cycles before any request once spent.
      RWE_NEWSAPI_ENABLED: ${RWE_NEWSAPI_ENABLED:-0}
      RWE_NEWSAPI_API_KEY: ${RWE_NEWSAPI_API_KEY:-}
      RWE_NEWSAPI_POLL_INTERVAL: ${RWE_NEWSAPI_POLL_INTERVAL:-900}
      RWE_NEWSAPI_ENDPOINT: ${RWE_NEWSAPI_ENDPOINT:-top-headlines}
      RWE_NEWSAPI_QUERY: ${RWE_NEWSAPI_QUERY:-}
      RWE_NEWSAPI_CATEGORY: ${RWE_NEWSAPI_CATEGORY:-}
      RWE_NEWSAPI_COUNTRY: ${RWE_NEWSAPI_COUNTRY:-}
      RWE_NEWSAPI_LANGUAGE: ${RWE_NEWSAPI_LANGUAGE:-}
      RWE_NEWSAPI_PAGE_SIZE: ${RWE_NEWSAPI_PAGE_SIZE:-100}
      RWE_NEWSAPI_MAX_ARTICLES: ${RWE_NEWSAPI_MAX_ARTICLES:-}
      RWE_NEWSAPI_DAILY_BUDGET: ${RWE_NEWSAPI_DAILY_BUDGET:-90}
      # Six additional providers (2026-07), ALL on the same shared pipeline + chassis semantics as
      # NewsAPI (rotation over comma lists, per-UTC-day budget, 429 accounting). Every one defaults
      # OFF; keyed ones need flag + key in deploy/.env. Defaults below are FREE-TIER SAFE — see
      # deploy/.env.production.example for the per-provider budget math before raising anything.
      # The Guardian Open Platform (single-outlet: everything resolves to "The Guardian").
      RWE_GUARDIAN_ENABLED: ${RWE_GUARDIAN_ENABLED:-0}
      RWE_GUARDIAN_API_KEY: ${RWE_GUARDIAN_API_KEY:-}
      RWE_GUARDIAN_POLL_INTERVAL: ${RWE_GUARDIAN_POLL_INTERVAL:-900}
      RWE_GUARDIAN_SECTION: ${RWE_GUARDIAN_SECTION:-}
      RWE_GUARDIAN_QUERY: ${RWE_GUARDIAN_QUERY:-}
      RWE_GUARDIAN_PAGE_SIZE: ${RWE_GUARDIAN_PAGE_SIZE:-50}
      RWE_GUARDIAN_MAX_ARTICLES: ${RWE_GUARDIAN_MAX_ARTICLES:-}
      RWE_GUARDIAN_DAILY_BUDGET: ${RWE_GUARDIAN_DAILY_BUDGET:-450}
      # NewsData.io (free tier: ~200 credits/day and size ≤ 10 — PAGE_SIZE default matches).
      RWE_NEWSDATA_ENABLED: ${RWE_NEWSDATA_ENABLED:-0}
      RWE_NEWSDATA_API_KEY: ${RWE_NEWSDATA_API_KEY:-}
      RWE_NEWSDATA_POLL_INTERVAL: ${RWE_NEWSDATA_POLL_INTERVAL:-900}
      RWE_NEWSDATA_QUERY: ${RWE_NEWSDATA_QUERY:-}
      RWE_NEWSDATA_CATEGORY: ${RWE_NEWSDATA_CATEGORY:-}
      RWE_NEWSDATA_COUNTRY: ${RWE_NEWSDATA_COUNTRY:-}
      RWE_NEWSDATA_LANGUAGE: ${RWE_NEWSDATA_LANGUAGE:-}
      RWE_NEWSDATA_PAGE_SIZE: ${RWE_NEWSDATA_PAGE_SIZE:-10}
      RWE_NEWSDATA_MAX_ARTICLES: ${RWE_NEWSDATA_MAX_ARTICLES:-}
      RWE_NEWSDATA_DAILY_BUDGET: ${RWE_NEWSDATA_DAILY_BUDGET:-190}
      # GNews (free tier: ~100 requests/day and max ≤ 10 — PAGE_SIZE default matches).
      RWE_GNEWS_ENABLED: ${RWE_GNEWS_ENABLED:-0}
      RWE_GNEWS_API_KEY: ${RWE_GNEWS_API_KEY:-}
      RWE_GNEWS_POLL_INTERVAL: ${RWE_GNEWS_POLL_INTERVAL:-900}
      RWE_GNEWS_QUERY: ${RWE_GNEWS_QUERY:-}
      RWE_GNEWS_CATEGORY: ${RWE_GNEWS_CATEGORY:-}
      RWE_GNEWS_COUNTRY: ${RWE_GNEWS_COUNTRY:-}
      RWE_GNEWS_LANGUAGE: ${RWE_GNEWS_LANGUAGE:-}
      RWE_GNEWS_PAGE_SIZE: ${RWE_GNEWS_PAGE_SIZE:-10}
      RWE_GNEWS_MAX_ARTICLES: ${RWE_GNEWS_MAX_ARTICLES:-}
      RWE_GNEWS_DAILY_BUDGET: ${RWE_GNEWS_DAILY_BUDGET:-95}
      # MediaStack (free tier VERIFIED 2026-07-26: 100 requests/MONTH → 8-hour interval + budget
      # 3/day ≈ 93/month; HTTPS is paid-only there — RWE_MEDIASTACK_HTTPS=0 downgrades to http,
      # a documented trade-off. Paid plans: shorten the interval + raise the budget explicitly).
      RWE_MEDIASTACK_ENABLED: ${RWE_MEDIASTACK_ENABLED:-0}
      RWE_MEDIASTACK_API_KEY: ${RWE_MEDIASTACK_API_KEY:-}
      RWE_MEDIASTACK_POLL_INTERVAL: ${RWE_MEDIASTACK_POLL_INTERVAL:-28800}
      RWE_MEDIASTACK_HTTPS: ${RWE_MEDIASTACK_HTTPS:-1}
      RWE_MEDIASTACK_QUERY: ${RWE_MEDIASTACK_QUERY:-}
      RWE_MEDIASTACK_CATEGORY: ${RWE_MEDIASTACK_CATEGORY:-}
      RWE_MEDIASTACK_COUNTRY: ${RWE_MEDIASTACK_COUNTRY:-}
      RWE_MEDIASTACK_LANGUAGE: ${RWE_MEDIASTACK_LANGUAGE:-}
      RWE_MEDIASTACK_PAGE_SIZE: ${RWE_MEDIASTACK_PAGE_SIZE:-100}
      RWE_MEDIASTACK_MAX_ARTICLES: ${RWE_MEDIASTACK_MAX_ARTICLES:-}
      RWE_MEDIASTACK_DAILY_BUDGET: ${RWE_MEDIASTACK_DAILY_BUDGET:-3}
      # Currents (free tier: ~600 requests/day and page_size ≤ 20 — the default matches; the API
      # 400s on more. The payload has no outlet field, so publishers resolve from each article
      # URL's own domain).
      RWE_CURRENTS_ENABLED: ${RWE_CURRENTS_ENABLED:-0}
      RWE_CURRENTS_API_KEY: ${RWE_CURRENTS_API_KEY:-}
      RWE_CURRENTS_POLL_INTERVAL: ${RWE_CURRENTS_POLL_INTERVAL:-900}
      RWE_CURRENTS_QUERY: ${RWE_CURRENTS_QUERY:-}
      RWE_CURRENTS_CATEGORY: ${RWE_CURRENTS_CATEGORY:-}
      RWE_CURRENTS_COUNTRY: ${RWE_CURRENTS_COUNTRY:-}
      RWE_CURRENTS_LANGUAGE: ${RWE_CURRENTS_LANGUAGE:-}
      RWE_CURRENTS_PAGE_SIZE: ${RWE_CURRENTS_PAGE_SIZE:-20}
      RWE_CURRENTS_MAX_ARTICLES: ${RWE_CURRENTS_MAX_ARTICLES:-}
      RWE_CURRENTS_DAILY_BUDGET: ${RWE_CURRENTS_DAILY_BUDGET:-550}
      # Google News RSS (keyless). TOPICS ⊆ {WORLD,NATION,BUSINESS,TECHNOLOGY,ENTERTAINMENT,
      # SPORTS,SCIENCE,HEALTH} and/or free-text QUERIES, comma-separated, rotated one feed per
      # cycle. Item links are Google redirect URLs (documented dedup limitation in sources.py).
      RWE_GOOGLENEWS_ENABLED: ${RWE_GOOGLENEWS_ENABLED:-0}
      RWE_GOOGLENEWS_POLL_INTERVAL: ${RWE_GOOGLENEWS_POLL_INTERVAL:-900}
      RWE_GOOGLENEWS_TOPICS: ${RWE_GOOGLENEWS_TOPICS:-}
      RWE_GOOGLENEWS_QUERIES: ${RWE_GOOGLENEWS_QUERIES:-}
      RWE_GOOGLENEWS_LANGUAGE: ${RWE_GOOGLENEWS_LANGUAGE:-en-US}
      RWE_GOOGLENEWS_COUNTRY: ${RWE_GOOGLENEWS_COUNTRY:-US}
      RWE_GOOGLENEWS_MAX_ARTICLES: ${RWE_GOOGLENEWS_MAX_ARTICLES:-}
      # Story clustering candidate set. The bound is a TIME WINDOW, not a row count: a row cap made
      # story yield track ingestion RATE, so every provider added shrank the hours in scope and
      # produced FEWER stories. Keep SCAN_DAYS >= the clustering window (clustering.py, 6 days) or
      # the threshold is fed a window narrower than it pairs over. MAX_SCAN is a memory backstop,
      # not the relevance rule. CACHE_TTL bounds staleness; catalog writes invalidate immediately.
      RWE_STORIES_SCAN_DAYS: ${RWE_STORIES_SCAN_DAYS:-6}
      RWE_STORIES_MAX_SCAN: ${RWE_STORIES_MAX_SCAN:-60000}
      # 600, matching RWE_POLL_INTERVAL, and the reason is measured (examples/perf_profile.py).
      # A cold story build is QUADRATIC in catalog size — 0.4 s of clustering at 5k articles, 1.6 s
      # at 10k, 7.4 s at 20k, 32 s at 40k — while a warm hit is 0.65 ms. Correctness never depended
      # on this TTL: the catalog fingerprint is part of the cache key so any write invalidates
      # immediately, and the poller calls warm_cache right after it ingests so that rebuild is paid
      # off the request path. At 120 s the TTL therefore expired four STILL-CORRECT builds per poll
      # cycle, each one a multi-second stall for whichever reader arrived first, buying nothing.
      # What it trades away is drift of the rolling 6-day window start: 10 minutes instead of 2,
      # well under a percent of the window.
      RWE_STORIES_CACHE_TTL: ${RWE_STORIES_CACHE_TTL:-600}
      # Clustering admission gates + rarity weighting. MIN_SHARED is distinctive tokens two
      # headlines must share (the ratio alone cannot tell "Trump wins Ohio"/"…Iowa" apart from real
      # co-coverage). IDF weights shared tokens by corpus rarity; it is OFF because measuring it on
      # 13,305 live articles cost 361 of 3,431 covered articles, only 16% of which came from the
      # press-release templates it was aimed at (docs/STORY_PIPELINE_AUDIT.md). =1 re-enables it
      # without a deploy, for re-running the experiment against a different catalog mix.
      RWE_CLUSTER_MIN_SHARED: ${RWE_CLUSTER_MIN_SHARED:-3}
      RWE_CLUSTER_MIN_TOKENS: ${RWE_CLUSTER_MIN_TOKENS:-3}
      RWE_CLUSTER_IDF: ${RWE_CLUSTER_IDF:-0}
      # Cluster trust (docs/CLUSTER_TRUST.md). geoCoherence is the one signal independent of the
      # clusterer, so it gates the blindspot claim and demotes suspect clusters out of the default
      # ranking — single-linkage chaining accumulates publishers, which means a false merge's
      # wrongness and its rank had the same cause. A score is only acted on with 4+ located members
      # behind it; TRUST_RANKING=0 restores pure size ordering without a deploy.
      RWE_STORY_COHERENCE_FLOOR: ${RWE_STORY_COHERENCE_FLOOR:-0.7}
      RWE_STORY_UNVERIFIED_SIZE: ${RWE_STORY_UNVERIFIED_SIZE:-50}
      RWE_STORY_TRUST_RANKING: ${RWE_STORY_TRUST_RANKING:-1}
      # Cluster-aware linkage. GLOBAL (LINK_QUORUM) is off: measured on 16,921 live articles it
      # cost 9.3% of covered articles, left the bad-cluster count at 3, and made mean coherence
      # WORSE (0.966 -> 0.952) by shredding coherent stories. TARGETED (REPAIR_QUORUM) applies the
      # same rule only to clusters the independent signal already condemns — 3 clusters, 1.6% of
      # covered articles, bad clusters 3 -> 1, mean coherence 0.966 -> 0.968. Reading the 56 pieces
      # the 336-article cluster produced settled it: a US-Iran war, a Seattle mass shooting, Canada
      # tariffs and a senator's funeral had been merged into one "story".
      RWE_CLUSTER_LINK_QUORUM: ${RWE_CLUSTER_LINK_QUORUM:-0}
      RWE_STORY_REPAIR_QUORUM: ${RWE_STORY_REPAIR_QUORUM:-0.5}
      # Machine-generated market-data feeds (outlet_registry.csv kind=wire) never enter story
      # clustering. Does nothing on its own — only outlets a human marked are affected.
      RWE_STORY_EXCLUDE_WIRE: ${RWE_STORY_EXCLUDE_WIRE:-1}
      # Keeps registry `kind = aggregator` sources out of clustering. An aggregator republishes
      # other outlets' articles, so counting one as a publisher double-counts coverage the cluster
      # already holds — measured, Zazoom alone contributed 815 articles to a six-day window. A
      # SEPARATE switch from the wire gate on purpose: a wire has no editorial stance, an aggregator
      # has someone else's, and an operator wanting one back should not have to take the other.
      RWE_STORY_EXCLUDE_AGGREGATOR: ${RWE_STORY_EXCLUDE_AGGREGATOR:-1}
      # Rated publishers a story needs before it may assert a coverage gap. Three, because there
      # are three lean buckets: below that an empty bucket is forced by arithmetic, not observed.
      # Measured before this existed: 516 of 1,022 stories claimed a gap and 89.1% of those rested
      # on one or two rated outlets. RWE_STORY_MIN_RATED=1 restores the old behaviour.
      RWE_STORY_MIN_RATED: ${RWE_STORY_MIN_RATED:-3}
      # Bars a registry `credibility = low` outlet from voting its lean — an outlet whose own rater
      # published a Questionable / Low Credibility verdict beside the rating. It stays full coverage
      # and its lean is still shown on the article; it just cannot help complete a coverage-gap
      # claim. Resolved from the registry at build time, so a corrected verdict lands on the next
      # build with no backfill. RWE_STORY_CREDIBILITY_GATE=0 restores pre-column behaviour.
      RWE_STORY_CREDIBILITY_GATE: ${RWE_STORY_CREDIBILITY_GATE:-1}
      # Second-pass duplicate merge (RECALL). Measured and adopted at 0.33: 14 merges, zero
      # dropped articles, largest cluster unchanged, bad-cluster count flat. All 14 were read by
      # hand -- Seattle 13+9, Fauci 8+5, the Iran pause 6+5, J&J talc, ICC/Karim Khan, the NC
      # missing-person case, Mamdani groceries -- with no false merge among them. Both known false
      # positives sat at 0.31 and the threshold excludes them. Guards: complete linkage, a
      # geoCoherence veto, and a size cap.
      RWE_STORY_MERGE_SIM: ${RWE_STORY_MERGE_SIM:-0.33}
      RWE_STORY_MERGE_MAX_GAP: ${RWE_STORY_MERGE_MAX_GAP:-48}
      RWE_STORY_MERGE_MAX_SIZE: ${RWE_STORY_MERGE_MAX_SIZE:-130}
      # A story keeps the id it was last served under (story_member table). Measured before this
      # existed: 5.1% of surviving stories changed id per DAY -- 72 of 81 because the earliest
      # member aged out of the rolling window, 9 because a backfilled article displaced it. Each
      # one is a saved or shared link that stops resolving. 0 reverts to deriving from the anchor.
      RWE_STORY_STABLE_IDS: ${RWE_STORY_STABLE_IDS:-1}
      # publisherCount counts OUTLETS, not name forms. Feeds send the same masthead as
      # "Sportskeeda.Com" and "Sportskeeda", and a syndication network as ~100 *.iheart.com station
      # hostnames. Measured: 181 of 1,367 names were duplicates, 60 stories had an inflated count,
      # and 35 cleared min_publishers only because one outlet was counted twice. 0 counts strings.
      RWE_STORY_PUBLISHER_IDENTITY: ${RWE_STORY_PUBLISHER_IDENTITY:-1}
      # Storage lifecycle (examples/retention_policy.py — the ONE typed policy module). 0 = keep
      # forever, uniformly; junk/negative values fall back to the default rather than deleting more.
      # User data (reads, saves, settings, accounts) has NO policy and is never pruned.
      RWE_RETENTION_MAX_COUNT: ${RWE_RETENTION_MAX_COUNT:-0}
      RWE_RETENTION_MAX_AGE_DAYS: ${RWE_RETENTION_MAX_AGE_DAYS:-0}
      RWE_RETENTION_SCORED_DAYS: ${RWE_RETENTION_SCORED_DAYS:-30}
      RWE_RETENTION_ANALYTICS_DAYS: ${RWE_RETENTION_ANALYTICS_DAYS:-180}
      RWE_RETENTION_REC_EVENT_DAYS: ${RWE_RETENTION_REC_EVENT_DAYS:-365}
      RWE_RETENTION_SNAPSHOTS_PER_USER: ${RWE_RETENTION_SNAPSHOTS_PER_USER:-500}
      RWE_RETENTION_NOTIFICATIONS_PER_USER: ${RWE_RETENTION_NOTIFICATIONS_PER_USER:-200}
      RWE_RETENTION_BATCH_LIMIT: ${RWE_RETENTION_BATCH_LIMIT:-5000}
      # --- production hardening (fail-closed auth) --------------------------------
      # This compose file runs in dev mode by default (the engine trusts the local
      # web service) so `up` is one command. For a real, internet-facing deployment,
      # set BOTH of these here AND the matching pair on the web service below — the
      # engine then refuses any per-user call without the secret, and refuses to even
      # start if RWE_ENV=production is set without RWE_INTERNAL_SECRET.
      # RWE_ENV: production
      # RWE_INTERNAL_SECRET: ${RWE_INTERNAL_SECRET}   # e.g. `openssl rand -base64 32`
      # --- switch datasets by configuration only (uncomment + mount ./data) ---
      # RWE_PROFILE: mind
      # RWE_NPZ: /data/mind.npz
      # RWE_PROFILE: politosphere
      # RWE_NPZ: /data/politosphere.npz
      # RWE_DOMAIN: reddit
      # RWE_PROFILE: qbias
      # RWE_QBIAS: /data/allsides_balanced_news.csv
      # --- optional: live AI-coach narrative ---
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      # Persist the SQLite store (default RWE_DB_URL -> /app/data/ih_beta.db) on a NAMED volume so
      # user data survives container recreation / redeploys — the durability guarantee. Backups
      # written by `db_backup.py` land in /app/data/backups on the same volume; copy them off-host
      # for real disaster recovery (see DEPLOYMENT.md).
      - ih-data:/app/data
      # The RSS feed list the background poller reads (RWE_RSS_FEEDS above) — the SAME file the one-shot
      # `ingest` service mounts, so seed + background refresh share one source of truth. Read-only.
      - ./rss_feeds.example.txt:/app/feeds/rss_feeds.txt:ro
      # Datasets (MIND/Politosphere/Qbias) are read-only and separate from the writable DB volume:
      # - ./data:/datasets:ro          # then set e.g. RWE_NPZ=/datasets/mind.npz
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      # The one-shot RSS ingest runs to completion FIRST, so the engine sees a populated FeedArticle
      # catalog at startup (it selects the corpus once, on boot). Ingest exits 0 even if some feeds
      # fail, so a flaky feed never blocks the deploy — the engine simply falls back to RWE_PROFILE.
      ingest:
        condition: service_completed_successfully

  # One-shot RSS ingest (runs on `up`, then exits): pulls cross-spectrum articles from real RSS/Atom
  # feeds into the shared FeedArticle catalog so recommendations can carry real publisher URLs. Edit
  # deploy/rss_feeds.example.txt to change the feed mix. `|| true` keeps an unreachable feed from
  # failing the deploy. Re-runs on every `up`, refreshing the catalog.
  ingest:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      RWE_RSS_FEEDS: /app/feeds/rss_feeds.txt
      RWE_LOG_LEVEL: INFO
    volumes:
      - ih-data:/app/data                                    # the SAME durable store the engine reads
      - ./rss_feeds.example.txt:/app/feeds/rss_feeds.txt:ro  # the feed list (edit to customize)
    command: ["sh", "-c", "python examples/rss_ingest.py run || true"]

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      # Loopback-only publish (see the api service above). Dev reaches the app at http://127.0.0.1:3000;
      # in the AWS prod stack Caddy proxies to `web:3000` over the private Docker network and the override
      # unpublishes this host port entirely, so the browser only ever talks to Caddy on 443.
      - "127.0.0.1:3000:3000"
    environment:
      RWE_BACKEND_URL: http://api:8000
      NODE_ENV: production
      # --- production hardening (must match the engine's pair above) --------------
      # With RWE_ENV=production the web app validates these AT STARTUP and refuses to
      # boot if any are missing (see DEPLOYMENT.md → "Startup validation").
      # RWE_ENV: production            # disables the dev demo-login; signals prod mode
      # RWE_INTERNAL_SECRET: ${RWE_INTERNAL_SECRET}   # identical to the engine's value
      # NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}           # openssl rand -base64 32
      # NEXTAUTH_URL: https://app.example.com         # this app's canonical URL (OAuth callbacks)
      # GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}         # required in prod (only sign-in method)
      # GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    depends_on:
      api:
        condition: service_healthy

  # One-shot backup: `docker compose run --rm backup` writes a timestamped, integrity-checked
  # snapshot into the shared data volume (/app/data/backups). Runs against the SAME volume as the
  # engine, so it needs no separate config. Schedule it from cron/systemd on the host.
  backup:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    profiles: ["backup"]               # not started by `up`; run explicitly
    volumes:
      - ih-data:/app/data
    command: ["python", "examples/db_backup.py", "backup"]

  # BR1 — RECURRING backups (opt-in): `docker compose -f deploy/docker-compose.yml --profile scheduler up -d backup-scheduler`.
  # Loops the same integrity-checked db_backup.py on BACKUP_INTERVAL and prunes to BACKUP_KEEP most-recent
  # — self-contained, reuses examples/db_backup.py, no application change. For OFF-HOST copies (a lost
  # volume must not take the only copy), EITHER set BACKUP_OFFHOST_CMD below (with credentials), OR
  # bind-mount /app/data/backups to a host path and sync it from the host. Recovery + verification:
  # deploy/ops/verify-restore.sh and docs/BETA_LAUNCH_CHECKLIST.md. `$$` escapes compose interpolation
  # so the container shell (not compose) expands the variables at runtime.
  backup-scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    profiles: ["scheduler"]            # not started by `up`; opt-in
    restart: unless-stopped
    environment:
      BACKUP_INTERVAL: "3600"          # seconds between backups (hourly)
      # RUNAWAY CEILING ONLY — not the retention policy. Real retention is TIERED and owned by the
      # host cron (deploy/ops/prune-backups.sh: hourly/daily/weekly/monthly), which must be able to
      # keep an old weekly slot that a flat "newest N" would delete. Keep this comfortably above the
      # tiered footprint (~23 files) so it only ever fires if the host cron stops running.
      BACKUP_KEEP: "60"
      # BACKUP_OFFHOST_CMD: 'aws s3 cp "$1" s3://acme-ih-backups/'   # optional off-host shipment ($1 = file)
    volumes:
      - ih-data:/app/data
    command:
      - sh
      - -c
      - |
        echo "backup-scheduler: every $${BACKUP_INTERVAL}s, keep $${BACKUP_KEEP} local"
        while true; do
          if python examples/db_backup.py backup; then
            dest=$$(ls -1t /app/data/backups/*.db 2>/dev/null | head -1)
            if [ -n "$$dest" ] && [ -n "$${BACKUP_OFFHOST_CMD:-}" ]; then
              sh -c "$$BACKUP_OFFHOST_CMD" _ "$$dest" || echo "backup-scheduler: off-host failed (local kept)"
            fi
            ls -1t /app/data/backups/*.db 2>/dev/null | tail -n +$$(( $${BACKUP_KEEP} + 1 )) | xargs -r rm -f
          else
            echo "backup-scheduler: backup failed this cycle"
          fi
          sleep "$${BACKUP_INTERVAL}"
        done

volumes:
  ih-data:                             # named volume: the durable SQLite store + local backups
