      # quorum/veto knobs above: the verified configuration must not live one lost env-file
      # line away from silently reverting. 0 is the kill switch.
      RWE_CLUSTER_TEMPLATE_GATE: ${RWE_CLUSTER_TEMPLATE_GATE:-1}
