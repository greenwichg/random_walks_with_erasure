      RWE_EVENT_JUDGE_MODEL: ${RWE_EVENT_JUDGE_MODEL:-claude-haiku-4-5}
      RWE_EVENT_JUDGE_BUDGET: ${RWE_EVENT_JUDGE_BUDGET:-120}
      RWE_EVENT_JUDGE_INTERVAL: ${RWE_EVENT_JUDGE_INTERVAL:-300}
      RWE_EVENT_BAND_HI: ${RWE_EVENT_BAND_HI:-0.5}
