      # coverage diverges as it runs, so legitimate late articles routinely match exactly one
      # member. Stays 1; the record lives on story_service.min_support.
      RWE_CLUSTER_MIN_SUPPORT: ${RWE_CLUSTER_MIN_SUPPORT:-1}
      # MEASURED 2026-08-25 AND REJECTED at "groups" too: 1.9% dropped and the cost bar printed
      # ADOPT, but --pieces showed the 106 splits were same-event fragmentation ("US national
      # debt passes $40tn" severed from "US debt tops $40 trillion"; one election split from
      # itself; the US-Canada tariff escalation cut three ways), plus new false merges downstream
