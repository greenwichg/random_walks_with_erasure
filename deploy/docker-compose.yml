      # slot budgets for the story / emerging / blind-spot-v2 sources (0 = off), the cohort spec
      # ("feature:pct", e.g. story_source:50), and the shadow-log feature list.
      RWE_REC_STORY_SOURCE: ${RWE_REC_STORY_SOURCE:-0}
      RWE_REC_EMERGING: ${RWE_REC_EMERGING:-0}
      RWE_REC_BLINDSPOT_SLOTS: ${RWE_REC_BLINDSPOT_SLOTS:-0}
      RWE_REC_EXPERIMENT: ${RWE_REC_EXPERIMENT:-}
      RWE_REC_SHADOW: ${RWE_REC_SHADOW:-}
