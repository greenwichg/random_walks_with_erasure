      # counterfactual without the stack regrew a 787-article blob. Empty string is the kill
      # switch. Defaulted HERE for the same reason as the quorum above: the verified
      # configuration must not live one lost env-file line away from silently reverting.
      RWE_CLUSTER_GEO_VETO: ${RWE_CLUSTER_GEO_VETO:-growth}
      # X5b entity-corroborated merge recall (adopted 2026-08-16, same doc): stories sharing >= 2
      # corroborated non-noise consensus names, mutually anchored by both tops, join — measured
      # 44 duplicate-family consolidations (Mangione x4, Farage, the cross-phrasing pairs no
      # lexical profile reaches) at zero dropped articles, largest 71. Requires article_entities
      # (the GKG entity cycle below keeps it current). 0 is the kill switch.
      RWE_STORY_ENTITY_MERGE: ${RWE_STORY_ENTITY_MERGE:-2}
      # X5c entity-disagreement veto (story_service.entity_veto) — the SAME entity channel spent
      # in the other direction. X5b above can only ever propose a merge; until this existed,
      # nothing could use entities to refuse one, so a text-similar merge with no geography
