      RWE_CLUSTER_SUPPORT_SCOPE: ${RWE_CLUSTER_SUPPORT_SCOPE:-any}
      RWE_STORY_REPAIR_QUORUM: ${RWE_STORY_REPAIR_QUORUM:-0.5}
