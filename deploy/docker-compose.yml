      #                                makes the per-day cap a cap: a held-back story expires rather
      #                                than arriving tomorrow as news.
      # Read at call time, so `bash deploy/ops/restart.sh api` applies a change with no rebuild.
      RWE_BREAKING_NOTIFICATIONS: ${RWE_BREAKING_NOTIFICATIONS:-0}
      RWE_BREAKING_MIN_PUBLISHERS: ${RWE_BREAKING_MIN_PUBLISHERS:-}
      RWE_BREAKING_TTL_HOURS: ${RWE_BREAKING_TTL_HOURS:-}
      # Browser push (Phase B1 — registration only; nothing sends yet). Default OFF, and off is what
      # the reader sees: with no key the config endpoint reports the feature unavailable and the web
      # tier renders no control, so no permission prompt can appear. Generating the key pair and
      # turning it on: docs/BROWSER_PUSH_OPERATIONS.md.
      #
      #   RWE_PUSH_ENABLED      the switch. Off ⇒ every push route 503s and the UI hides the control.
      #   RWE_VAPID_PUBLIC_KEY  served to browsers; they subscribe against it. Public by construction.
      #   RWE_VAPID_PRIVATE_KEY signs the sends. READ BY NOTHING until B2 — wired now so the operator
      #                         generates and stores the PAIR once, and B2 needs no compose change.
      #   RWE_VAPID_SUBJECT     the mailto:/https: contact the push service is given. Also B2.
      #
      # Rotating the pair invalidates every existing subscription; the web tier detects the mismatch
      # and re-subscribes each device on its next visit (web/lib/push.ts::subscriptionMatchesKey).
      RWE_PUSH_ENABLED: ${RWE_PUSH_ENABLED:-0}
      RWE_VAPID_PUBLIC_KEY: ${RWE_VAPID_PUBLIC_KEY:-}
      RWE_VAPID_PRIVATE_KEY: ${RWE_VAPID_PRIVATE_KEY:-}
      RWE_VAPID_SUBJECT: ${RWE_VAPID_SUBJECT:-}
      # How many devices one reader may hold (default 10; 0 = unbounded). Every device is a
      # send attempt per notification once B2 exists, and nothing else bounds how many an
      # authenticated reader accumulates — a fresh browser profile mints a new endpoint.
      RWE_PUSH_MAX_DEVICES: ${RWE_PUSH_MAX_DEVICES:-}
      # Delivery (Phase B2). SEPARATE from RWE_PUSH_ENABLED, which governs registration: an operator
      # can let readers subscribe and watch the subscription table before anything is ever sent to
      # them. Turning this on is the act that first puts a notification on a lock screen.
      #
      #   RWE_PUSH_DELIVERY         1/true/yes/on runs the fan-out on the poller's post-cycle seam.
      #                             Needs RWE_VAPID_PRIVATE_KEY and RWE_VAPID_SUBJECT — without
      #                             either, delivery stays off however this is set.
      #   RWE_PUSH_SEND_TIMEOUT_MS  per-send deadline (default 10000). A wedged push service must
      #                             fail rather than hold a worker thread.
      RWE_PUSH_DELIVERY: ${RWE_PUSH_DELIVERY:-0}
      RWE_PUSH_SEND_TIMEOUT_MS: ${RWE_PUSH_SEND_TIMEOUT_MS:-}
      # Rate limiting (Phase B4). A TOKEN BUCKET PER PUSH SERVICE, not a global one: endpoints belong
      # to a handful of independent operators, and throttling Firefox because Chrome is slow punishes
      # the wrong readers. On by default — the failure it prevents (tripping a push service's own
      # limit, turning every send into a retry) is silent and gradual. `0` switches it off.
      RWE_PUSH_MAX_SENDS_PER_SECOND: ${RWE_PUSH_MAX_SENDS_PER_SECOND:-}
      # ── Weekly digest EMAIL (off until configured) ──────────────────────────────────────
      #   RWE_EMAIL_ENABLED   the switch. Off ⇒ the worker does nothing and the in-app digest is
      #                       untouched; this is the state every deployment starts in.
      #   RWE_SMTP_*          any SMTP relay: Amazon SES (email-smtp.<region>.amazonaws.com:587
      #                       with SES SMTP credentials), Postmark, SendGrid, a local relay. The
      #                       engine speaks SMTP rather than one vendor's API precisely so this is
      #                       configuration and not code.
      #   RWE_EMAIL_FROM      the From address. Its DOMAIN must be verified with the provider and
      #                       carry SPF + DKIM (and ideally DMARC), or mail lands in spam or is
      #                       rejected outright. That is DNS work, not deployment work.
      #   RWE_EMAIL_SECRET    signs unsubscribe tokens. WITHOUT IT NOTHING IS SENT — mail a reader
      #                       cannot escape is worse than mail they never got.
      #   RWE_EMAIL_ALLOWLIST who may receive AT ALL, whatever their settings say — an operator
      #                       gate, not a reader preference, so it fails closed the other way from
      #                       everything else here: UNSET MEANS NOBODY. A comma-separated list of
      #                       addresses and/or @domains during beta; `*` for general delivery,
      #                       which is then a deliberate act rather than a lost line in .env.
      #   RWE_PUBLIC_URL      the base for the report and unsubscribe links in the mail.
      RWE_EMAIL_ENABLED: ${RWE_EMAIL_ENABLED:-0}
      RWE_SMTP_HOST: ${RWE_SMTP_HOST:-}
      RWE_SMTP_PORT: ${RWE_SMTP_PORT:-587}
      RWE_SMTP_USER: ${RWE_SMTP_USER:-}
      RWE_SMTP_PASSWORD: ${RWE_SMTP_PASSWORD:-}
      RWE_EMAIL_FROM: ${RWE_EMAIL_FROM:-}
      # Where a reply should go when the From address is not a mailbox — `digest@hidden-view.com`
      # is verified with SES for SENDING and has no inbox behind it. Empty ⇒ no header at all.
      RWE_EMAIL_REPLY_TO: ${RWE_EMAIL_REPLY_TO:-}
      RWE_EMAIL_SECRET: ${RWE_EMAIL_SECRET:-}
      RWE_EMAIL_ALLOWLIST: ${RWE_EMAIL_ALLOWLIST:-}
      RWE_PUBLIC_URL: ${RWE_PUBLIC_URL:-}
      RWE_EMAIL_MAX_PER_RUN: ${RWE_EMAIL_MAX_PER_RUN:-500}
      RWE_EMAIL_RETRY_MAX: ${RWE_EMAIL_RETRY_MAX:-}
      # Storage lifecycle (examples/retention_policy.py — the ONE typed policy module). 0 = keep
      # forever, uniformly; junk/negative values fall back to the default rather than deleting more.
      # User data (reads, saves, settings, accounts) has NO policy and is never pruned.
      RWE_RETENTION_MAX_COUNT: ${RWE_RETENTION_MAX_COUNT:-0}
      RWE_RETENTION_MAX_AGE_DAYS: ${RWE_RETENTION_MAX_AGE_DAYS:-0}
      # Per-tier AGE overrides (M2, docs/SCALE_ROADMAP.md). 0 = that tier uses MAX_AGE_DAYS above.
      #
      # A COUNT cap is an age cap whose length nobody chose: 150,000 rows is ~32 days at today's
      # ~4,650 articles/day, ONE day at 150k/day and SEVEN HOURS at 500k/day. The corpus contract
      # makes the Full/Searchable corpus responsible for being "complete and findable", so the same
      # unchanged setting quietly turns the archive into hours as source coverage grows — and
      # nothing about it looks different from the outside. Age is the shape that does not move when
      # ingestion does.
      #
      # BOTH 0 IS THE SHIPPED STATE and changes nothing: with no per-tier rule the planner applies
      # the scalar to every article exactly as before. Read the horizon BEFORE setting either:
      #   dc run --rm -T api python examples/audit_retention_horizon.py --db "$RWE_DB_URL"
      # Retention DELETES. The floors in corpus_health (per-bucket, publishers, fresh, total) hold
      # whatever age policy is configured, per-tier or global, so a prune can never breach them.
      RWE_RETENTION_MAX_AGE_DAYS_TIER_B: ${RWE_RETENTION_MAX_AGE_DAYS_TIER_B:-0}
      RWE_RETENTION_MAX_AGE_DAYS_SHADOW: ${RWE_RETENTION_MAX_AGE_DAYS_SHADOW:-0}
      RWE_RETENTION_SCORED_DAYS: ${RWE_RETENTION_SCORED_DAYS:-30}
      RWE_RETENTION_ANALYTICS_DAYS: ${RWE_RETENTION_ANALYTICS_DAYS:-180}
      RWE_RETENTION_REC_EVENT_DAYS: ${RWE_RETENTION_REC_EVENT_DAYS:-365}
      RWE_RETENTION_SNAPSHOTS_PER_USER: ${RWE_RETENTION_SNAPSHOTS_PER_USER:-500}
      RWE_RETENTION_NOTIFICATIONS_PER_USER: ${RWE_RETENTION_NOTIFICATIONS_PER_USER:-200}
      RWE_RETENTION_BATCH_LIMIT: ${RWE_RETENTION_BATCH_LIMIT:-5000}
      # --- production hardening (fail-closed auth) --------------------------------
      # This compose file runs in dev mode by default (the engine trusts the local
      # web service) so `up` is one command. For a real, internet-facing deployment,
      # set BOTH of these here AND the matching pair on the web service below — the
      # engine then refuses any per-user call without the secret, and refuses to even
      # start if RWE_ENV=production is set without RWE_INTERNAL_SECRET.
      # RWE_ENV: production
      # RWE_INTERNAL_SECRET: ${RWE_INTERNAL_SECRET}   # e.g. `openssl rand -base64 32`
      # --- switch datasets by configuration only (uncomment + mount ./data) ---
      # RWE_PROFILE: mind
      # RWE_NPZ: /data/mind.npz
      # RWE_PROFILE: politosphere
      # RWE_NPZ: /data/politosphere.npz
      # RWE_DOMAIN: reddit
      # RWE_PROFILE: qbias
      # RWE_QBIAS: /data/allsides_balanced_news.csv
      # --- optional: live AI-coach narrative ---
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      # Persist the SQLite store (default RWE_DB_URL -> /app/data/ih_beta.db) on a NAMED volume so
      # user data survives container recreation / redeploys — the durability guarantee. Backups
      # written by `db_backup.py` land in /app/data/backups on the same volume; copy them off-host
      # for real disaster recovery (see DEPLOYMENT.md).
      - ih-data:/app/data
      # The RSS feed list the background poller reads (RWE_RSS_FEEDS above) — the SAME file the one-shot
      # `ingest` service mounts, so seed + background refresh share one source of truth. Read-only.
      - ./rss_feeds.example.txt:/app/feeds/rss_feeds.txt:ro
      # Datasets (MIND/Politosphere/Qbias) are read-only and separate from the writable DB volume:
      # - ./data:/datasets:ro          # then set e.g. RWE_NPZ=/datasets/mind.npz
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      # The one-shot RSS ingest runs to completion FIRST, so the engine sees a populated FeedArticle
      # catalog at startup (it selects the corpus once, on boot). Ingest exits 0 even if some feeds
      # fail, so a flaky feed never blocks the deploy — the engine simply falls back to RWE_PROFILE.
      ingest:
        condition: service_completed_successfully

  # One-shot RSS ingest (runs on `up`, then exits): pulls cross-spectrum articles from real RSS/Atom
  # feeds into the shared FeedArticle catalog so recommendations can carry real publisher URLs. Edit
  # deploy/rss_feeds.example.txt to change the feed mix. `|| true` keeps an unreachable feed from
  # failing the deploy. Re-runs on every `up`, refreshing the catalog.
  ingest:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      RWE_RSS_FEEDS: /app/feeds/rss_feeds.txt
      # robots.txt gate on the LIVE feed poller (F1 of the M7 Stage 2 audit: robots existed only in
      # the crawler POC, which has never run, while this poller had no gate at all). Default ON, and
      # it refuses only on an explicit `Disallow` — an unreadable policy is reported, not enforced,
      # because a CDN hiccup must not silently stop ingestion from a publisher who never objected.
      #   RWE_ROBOTS_ENFORCE=0  kill switch: disable the gate entirely
      #   RWE_ROBOTS_STRICT=1   also refuse when no policy can be read (the crawler's posture)
      # Listed here even while empty: `environment:` is an allowlist with no `env_file:`, so a
      # switch missing from this block cannot be turned off in an incident.
      RWE_ROBOTS_ENFORCE: ${RWE_ROBOTS_ENFORCE:-}
      RWE_ROBOTS_STRICT: ${RWE_ROBOTS_STRICT:-}
      # The publisher CRAWLER, wired into the poller as a SourceAdapter. OFF by default: unlike the
      # keyed adapters, which need an API key before they can do anything, a crawl config is just a
      # file — so the flag is the safety catch. Turning it on still crawls nothing unless a
      # publisher is BOTH enabled in examples/data/crawler_publishers.json AND named in
      # RWE_CORPUS_SHADOW: Tier A is the default tier, so crawling an unshadowed outlet would put
      # its articles straight into the clustering corpus, which is promotion by omission.
      #   RWE_CRAWL_ENABLED=1   turn the crawler on
      #   RWE_CRAWL_INTERVAL    seconds between cycles per publisher (default 900)
      RWE_CRAWL_ENABLED: ${RWE_CRAWL_ENABLED:-}
      RWE_CRAWL_INTERVAL: ${RWE_CRAWL_INTERVAL:-}
      # Phase 2 web-discovery channel (`source_web.py`). ALL EMPTY BY DEFAULT, and the emptiness is
      # the safety property: `search_adapter()` returns None without an endpoint, and `discover`
      # treats None as "plan the queries, ask nobody". So an unconfigured deployment cannot make a
      # search request however many other switches are on.
      #
      # Listed here even while empty for the reason this block repeats throughout: `environment:` is
      # an explicit allowlist with no `env_file:`, so a variable absent from it never reaches the
      # container — and a search provider set in deploy/.env that silently did nothing would read as
      # "the web has no outlets for these gaps".
      #
      # Querying a search API is the one act in this pipeline that is genuinely new; the probe's
      # robots/landing/feed requests are what the existing channels already do. Whose API, and on
      # what terms, is an operator decision — which is why this is an endpoint template rather than
      # a provider baked into code.
      RWE_WEB_SEARCH_PROVIDER: ${RWE_WEB_SEARCH_PROVIDER:-}
      RWE_WEB_SEARCH_API_KEY: ${RWE_WEB_SEARCH_API_KEY:-}
      RWE_WEB_SEARCH_CX: ${RWE_WEB_SEARCH_CX:-}
      RWE_WEB_SEARCH_ENDPOINT: ${RWE_WEB_SEARCH_ENDPOINT:-}
      RWE_WEB_SEARCH_HEADER: ${RWE_WEB_SEARCH_HEADER:-}
      RWE_WEB_SEARCH_RESULTS: ${RWE_WEB_SEARCH_RESULTS:-}
      RWE_WEB_SEARCH_URL_FIELD: ${RWE_WEB_SEARCH_URL_FIELD:-}
      RWE_WEB_SEARCH_TITLE_FIELD: ${RWE_WEB_SEARCH_TITLE_FIELD:-}
      RWE_WEB_SEARCH_COUNT: ${RWE_WEB_SEARCH_COUNT:-}
      # Minimum seconds between catalog-wide post-cycle passes (retention + the hot refresh).
      # Default 600, matching RWE_POLL_INTERVAL. Production measured 87.8% lock occupancy because
      # each of ~11 adapter threads ran its own full pass whenever it found a single article, at a
      # cost set by catalog size rather than by yield. Set to 0 to restore the per-cycle behaviour
      # exactly — an off switch that is not a rollback, which only works if the variable can
      # actually reach the container.
      RWE_POST_CYCLE_MAINTENANCE_INTERVAL: ${RWE_POST_CYCLE_MAINTENANCE_INTERVAL:-}
      # Size of the bounded poll pool (M6.3). 0 = one thread per adapter, the pre-M6.3 model and
      # the default, so deploying the pool changes nothing. Set it when source count reaches the
      # hundreds: it caps CONCURRENT FETCHES rather than sources, which is the point — thread count
      # and source count were the same number until M6.3.
      #
      # Declared here for the same reason as everything above it: `environment:` is an explicit
      # allowlist with no `env_file:`, and this omission has now shipped FOUR times in this series.
      # A switch that cannot reach the container is worse than no switch, because it is believed.
      RWE_POLL_WORKERS: ${RWE_POLL_WORKERS:-}
      # The tier assignment the switch above DEPENDS ON, and the reason it must be listed here: the
      # crawl flag shipped to this service without it, so `RWE_CRAWL_ENABLED=1` was visible here and
      # `RWE_CORPUS_SHADOW` was not. That failed CLOSED — every adapter refused, because an outlet
      # absent from the list is Tier A and `CrawlAdapter.enabled()` requires shadow — but it refused
      # for a reason the operator had already fixed, printing "not in RWE_CORPUS_SHADOW" about a
      # variable they had just set. A switch whose precondition cannot reach the container is the
      # RWE_FEED_MIN_INTERVAL lesson again, one service over.
      # Both vars, not just the shadow one: `corpus.tier_of` reads them together, so passing one
      # would make an outlet resolve Tier B in the api and Tier A here, on the same catalog.
      RWE_CORPUS_TIER_B: ${RWE_CORPUS_TIER_B:-}
      RWE_CORPUS_SHADOW: ${RWE_CORPUS_SHADOW:-}
      # The same block list the api poller uses — the seeding run must not import what the poller
      # would refuse. See the comment on the api service.
      RWE_CATALOG_BLOCKED_OUTLETS: ${RWE_CATALOG_BLOCKED_OUTLETS:-}
      RWE_LOG_LEVEL: INFO
    volumes:
      - ih-data:/app/data                                    # the SAME durable store the engine reads
      - ./rss_feeds.example.txt:/app/feeds/rss_feeds.txt:ro  # the feed list (edit to customize)
    command: ["sh", "-c", "python examples/rss_ingest.py run || true"]

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      # Loopback-only publish (see the api service above). Dev reaches the app at http://127.0.0.1:3000;
      # in the AWS prod stack Caddy proxies to `web:3000` over the private Docker network and the override
      # unpublishes this host port entirely, so the browser only ever talks to Caddy on 443.
      - "127.0.0.1:3000:3000"
    environment:
      RWE_BACKEND_URL: http://api:8000
      NODE_ENV: production
      # Both are read at CALL time by the web tier, so changing either takes effect on
      # `docker compose up -d web` with no rebuild. That is the whole point of listing them:
      # `environment:` is an explicit allowlist and this stack has no `env_file:`, so a variable
      # absent from here never reaches the container no matter what deploy/.env says — compose
      # reads that file to substitute ${VAR}, not to inject it. Identity recovery's documented
      # rollback depended on this line existing.
      #
      #   RWE_IDENTITY_RECOVERY   0/false/no/off disables identity recovery (docs/SESSION_IDENTITY_
      #                           RECOVERY_DESIGN.md); anything else, including empty, leaves it on.
      #   RWE_BACKEND_TIMEOUT_MS  deadline for every engine call. Empty ⇒ the code default (6000).
      #                           Left empty here so the default has ONE home, in lib/engine-timeout.ts.
      RWE_IDENTITY_RECOVERY: ${RWE_IDENTITY_RECOVERY:-1}
      RWE_BACKEND_TIMEOUT_MS: ${RWE_BACKEND_TIMEOUT_MS:-}
      # --- production hardening (must match the engine's pair above) --------------
      # With RWE_ENV=production the web app validates these AT STARTUP and refuses to
      # boot if any are missing (see DEPLOYMENT.md → "Startup validation").
      # RWE_ENV: production            # disables the dev demo-login; signals prod mode
      # RWE_INTERNAL_SECRET: ${RWE_INTERNAL_SECRET}   # identical to the engine's value
      # NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}           # openssl rand -base64 32
      # NEXTAUTH_URL: https://app.example.com         # this app's canonical URL (OAuth callbacks)
      # GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}         # required in prod (only sign-in method)
      # GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # --- native (Android / iOS) sign-in ----------------------------------------
      # Forwarded ACTIVELY with an empty default, unlike the commented block above, and the
      # difference is deliberate. A variable this file does not forward is invisible to the
      # process no matter what deploy/.env says — that is exactly how RWE_EMAIL_REPLY_TO was
      # shipped, configured, and silently absent from every message. With these lines present,
      # setting them in deploy/.env is enough; leaving them unset means POST /api/auth/mobile
      # answers 500 `not-configured` and mints nothing, which is the correct fail-closed state
      # and is covered by e2e/specs/mobile-exchange.spec.ts.
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID:-}
      GOOGLE_ANDROID_CLIENT_ID: ${GOOGLE_ANDROID_CLIENT_ID:-}
    depends_on:
      api:
        condition: service_healthy

  # One-shot backup: `docker compose run --rm backup` writes a timestamped, integrity-checked
  # snapshot into the shared data volume (/app/data/backups). Runs against the SAME volume as the
  # engine, so it needs no separate config. Schedule it from cron/systemd on the host.
  backup:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    profiles: ["backup"]               # not started by `up`; run explicitly
    volumes:
      - ih-data:/app/data
    command: ["python", "examples/db_backup.py", "backup"]

  # BR1 — RECURRING backups (opt-in): `docker compose -f deploy/docker-compose.yml --profile scheduler up -d backup-scheduler`.
  # Loops the same integrity-checked db_backup.py on BACKUP_INTERVAL and prunes to BACKUP_KEEP most-recent
  # — self-contained, reuses examples/db_backup.py, no application change. For OFF-HOST copies (a lost
  # volume must not take the only copy), EITHER set BACKUP_OFFHOST_CMD below (with credentials), OR
  # bind-mount /app/data/backups to a host path and sync it from the host. Recovery + verification:
  # deploy/ops/verify-restore.sh and docs/BETA_LAUNCH_CHECKLIST.md. `$$` escapes compose interpolation
  # so the container shell (not compose) expands the variables at runtime.
  backup-scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    profiles: ["scheduler"]            # not started by `up`; opt-in
    restart: unless-stopped
    environment:
      BACKUP_INTERVAL: "3600"          # seconds between backups (hourly)
      # RUNAWAY CEILING ONLY — not the retention policy. Real retention is TIERED and owned by the
      # host cron (deploy/ops/prune-backups.sh: hourly/daily/weekly/monthly), which must be able to
      # keep an old weekly slot that a flat "newest N" would delete. Keep this comfortably above the
      # tiered footprint (~23 files) so it only ever fires if the host cron stops running.
      BACKUP_KEEP: "60"
      # BACKUP_OFFHOST_CMD: 'aws s3 cp "$1" s3://acme-ih-backups/'   # optional off-host shipment ($1 = file)
    volumes:
      - ih-data:/app/data
    command:
      - sh
      - -c
      - |
        echo "backup-scheduler: every $${BACKUP_INTERVAL}s, keep $${BACKUP_KEEP} local"
        while true; do
          if python examples/db_backup.py backup; then
            # BOTH suffixes. Backups are gzipped by default, so globbing only '*.db' matched
            # nothing: off-host shipment never ran and this ceiling never fired — silently, for as
            # long as compression was on. deploy/ops/prune-backups.sh already carried the fix; this
            # loop did not.
            dest=$$(ls -1t /app/data/backups/*.db.gz /app/data/backups/*.db 2>/dev/null | head -1)
            if [ -n "$$dest" ] && [ -n "$${BACKUP_OFFHOST_CMD:-}" ]; then
              # Ship the whole SET, not just the database: allowlist.txt and score_reference.json
              # are not inside it and cannot be rebuilt from it, so a database alone restores into
              # a product nobody can sign in to. One call per file keeps the documented
              # BACKUP_OFFHOST_CMD contract ($$1 = the file) unchanged.
              stem=$${dest%.gz}; stem=$${stem%.db}
              for f in "$$dest" "$$stem.allowlist.txt" "$$stem.score_reference.json"; do
                [ -f "$$f" ] || continue
                sh -c "$$BACKUP_OFFHOST_CMD" _ "$$f" || echo "backup-scheduler: off-host failed for $$f (local kept)"
              done
            fi
            # Prune a snapshot WITH its sidecars, so the ceiling cannot leave orphans behind.
            ls -1t /app/data/backups/*.db.gz /app/data/backups/*.db 2>/dev/null \
              | tail -n +$$(( $${BACKUP_KEEP} + 1 )) \
              | while read -r old; do
                  s=$${old%.gz}; s=$${s%.db}
                  rm -f "$$old" "$$s.allowlist.txt" "$$s.score_reference.json"
                done
          else
            echo "backup-scheduler: backup failed this cycle"
          fi
          sleep "$${BACKUP_INTERVAL}"
        done

volumes:
  ih-data:                             # named volume: the durable SQLite store + local backups
