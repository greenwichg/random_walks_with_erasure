      # the GIL against every request handler, which is the measured mechanism behind the
      # post-ingest windows (2026-08-01: /api/health 2-3 ms -> 55 ms while the 11.5 s warm ran).
      # One persistent forkserver worker does the clustering on the second core; the serving
      # process keeps its GIL. The worker re-imports the app module once at boot (a multiprocessing
      # prepare-step property, documented on story_service._build_pool) and reads the SAME WAL
      # database file, read-only; identity writes stay in the api process. Requires the file-backed
      # DB this stack already uses; falls back to the inline build silently on any worker failure
      # (counters story_build_subprocess_total / _failed_total in /api/metrics). `0` disables.
      RWE_STORY_BUILD_SUBPROCESS: ${RWE_STORY_BUILD_SUBPROCESS:-}
