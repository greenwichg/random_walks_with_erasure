      #
      # MEASURED 2026-08-25 AND ADOPTED: droppedOut 0 of 6,127 covered articles (0.0%), stories
      # 1,501 -> 1,502, largest 60 unchanged, independent signal identical (0/63 bad, mean 0.953
      # both sides), blindspot claims 202 -> 202. One cluster split, no article left a story.
