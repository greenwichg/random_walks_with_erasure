      # while off the route exists and always answers `null`, so the client contract ships and can
      # be exercised before the surface does. Same allowlist reason as RWE_STORY_SLOT above: without
      # this line the flag could never reach the container. Measured eligible rate at 2026-08-03 is
      # ~5-12% of reads (examples/audit_continuation.py) — bounded by cluster membership, not leans.
      RWE_STORY_CONTINUATION: ${RWE_STORY_CONTINUATION:-0}
