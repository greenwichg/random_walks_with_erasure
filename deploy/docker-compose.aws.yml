# Production override for the AWS EC2 closed-beta deployment (Wave 0).
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.aws.yml --env-file deploy/.env up -d --build
#   (deploy/ops/deploy.sh wraps exactly this.)
#
# DEPLOYMENT-ONLY. This file changes no application code or behavior. It layers operator concerns on top
# of the base compose:
#   • adds Caddy as the single internet-facing service (TLS + reverse proxy) — §caddy
#   • turns on the app's OWN fail-closed production mode (RWE_ENV=production + secrets) — the engine and
#     web tier already implement this; here we only supply the values
#   • unpublishes the app/engine host ports so ONLY Caddy is reachable, and Caddy reaches the app over the
#     private Docker network (service name `web:3000`), never host networking
#   • adds restart policies so the stack self-heals after a crash or an EC2 reboot
#   • bind-mounts the SQLite store + backups to a host path so scheduled `aws s3 sync` can ship them
#     off-host (the DB engine and file are unchanged — only the mount source moves from a named volume
#     to a host directory)
#
# `!reset []` clears a list set by the base file; `!override` replaces a list instead of appending to it
# (Compose merges list-valued keys by concatenation otherwise). Requires Docker Compose v2.24+ — the
# standard Ubuntu 24.04 `get.docker.com` install provides a newer version. Host data dir defaults to
# /opt/ih/data; override with IH_DATA_DIR in deploy/.env.

services:
  # ── Internet-facing edge: the ONLY service with published ports ────────────────────────────────────
  # Terminates TLS (automatic Let's Encrypt) and reverse-proxies to the web app over the private Docker
  # network. Certs live in the caddy_data volume so they survive redeploys (no rate-limit churn).
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"      # ACME HTTP-01 challenge + HTTP→HTTPS redirect
      - "443:443"    # HTTPS
    environment:
      # Substituted into deploy/Caddyfile. Apex is served; www redirects to it (operator choice).
      APP_DOMAIN: ${APP_DOMAIN:-hidden-view.com}
      ACME_EMAIL: ${ACME_EMAIL:-ops@hidden-view.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # issued certificates — persist across redeploys
      - caddy_config:/config
    depends_on:
      - web
    healthcheck:
      # Probe Caddy's admin API (localhost:2019, enabled by default) — a GET of /config/ returns 200 once
      # the process is up and its config is loaded. This is a true liveness signal that changes NO serving
      # behavior. The previous probe (`wget --spider http://127.0.0.1:80`) false-reported "unhealthy":
      # port 80 issues the 80→443 redirect, which busybox wget follows to the public HTTPS URL and cannot
      # complete from inside the container (the instance can't hairpin to its own Elastic IP). Caddy was
      # serving fine the whole time — only the health status was wrong.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Next.js web tier (BA1 / NextAuth / OAuth live here) ────────────────────────────────────────────
  web:
    restart: unless-stopped
    ports: !reset []           # not published to the host — reachable only via Caddy on the Docker network
    environment:
      # Turns ON the app's existing fail-closed production mode. The web container validates these at
      # startup (web/instrumentation.ts) and refuses to boot if any required value is missing.
      RWE_ENV: production
      RWE_INTERNAL_SECRET: ${RWE_INTERNAL_SECRET:?set RWE_INTERNAL_SECRET in deploy/.env}
      RWE_BACKEND_URL: http://api:8000
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL (e.g. https://hidden-view.com) in deploy/.env}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in deploy/.env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in deploy/.env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in deploy/.env}
      # BA1 invite-only gate. Defaults ON in production; set explicitly + supply the allowlist (an
      # enabled-but-empty allowlist is fail-closed = everyone denied, by design).
      BETA_ACCESS_ENABLED: ${BETA_ACCESS_ENABLED:-1}
      BETA_ALLOWLIST: ${BETA_ALLOWLIST:-}
      BETA_ALLOWLIST_FILE: ${BETA_ALLOWLIST_FILE:-}
    volumes:
      # READ-ONLY data mount, and the only reason it exists: BETA_ALLOWLIST_FILE is documented as
      # /app/data/allowlist.txt, but `web` had no volumes at all — so that path did not exist inside
      # this container, `loadAllowlist` swallowed the ENOENT, and the file-based allowlist silently
      # did nothing. Every grant written to the file was ignored and every tester saw "invite-only".
      #
      # The failure was invisible from both ends: the CLI (in `api`, where /app/data IS mounted)
      # reported success, and the gate reported `empty_allowlist` without saying which file it had
      # failed to read. ro because `web` only ever reads this one file — the engine owns the database.
      - ${IH_DATA_DIR:-/opt/ih/data}:/app/data:ro

  # ── FastAPI recommendation engine (never internet-reachable) ───────────────────────────────────────
  api:
    restart: unless-stopped
    ports: !reset []           # engine is private: only `web` (same Docker network) calls it
    environment:
      # Fail-closed engine auth: with RWE_ENV=production it refuses per-user calls without the shared
      # secret, and refuses to boot if the secret is unset.
      RWE_ENV: production
      RWE_INTERNAL_SECRET: ${RWE_INTERNAL_SECRET:?set RWE_INTERNAL_SECRET in deploy/.env}
      RWE_DB_URL: ${RWE_DB_URL:-sqlite:////app/data/ih_beta.db}
      # The beta allowlist file, so `docker exec deploy-api-1 python scripts/manage_users.py` edits
      # the SAME file the `web` gate reads. The api tier never enforces the gate — it only needs the
      # path. Without this the CLI would fall back to its default and could silently maintain a file
      # nothing consults, which is the failure mode of every "two deployables disagreeing" bug in
      # this repo's history.
      BETA_ALLOWLIST_FILE: ${BETA_ALLOWLIST_FILE:-}
      BETA_ALLOWLIST: ${BETA_ALLOWLIST:-}
      BETA_ACCESS_ENABLED: ${BETA_ACCESS_ENABLED:-1}
      # Coach v2 (M6): the MEASURED reader's coach routes through the intent-routed pipeline
      # (trigger ladder / weekly recap / grounded replies). Engine-side only; the demo path stays
      # v1 regardless. Default 0 = OFF (byte-identical to v1, pinned by test_coach_v1_contract.py),
      # so an unset var never changes behavior — opt in by setting RWE_COACH_V2=1 in deploy/.env.
      RWE_COACH_V2: ${RWE_COACH_V2:-0}
    volumes: !override
      - ${IH_DATA_DIR:-/opt/ih/data}:/app/data   # host-visible DB + backups (for off-host S3 sync)
      # The background poller's feed list (RWE_RSS_FEEDS, from the base compose) — the SAME file the
      # `ingest` service mounts. Required here because !override replaces the api volume list, so without
      # this line the mount from the base file is dropped and the poller loads zero feeds (INCIDENT fix).
      - ./rss_feeds.example.txt:/app/feeds/rss_feeds.txt:ro

  # ── One-shot RSS seed (unchanged behavior; only its data mount follows the bind-mount) ─────────────
  ingest:
    volumes: !override
      - ${IH_DATA_DIR:-/opt/ih/data}:/app/data
      - ./rss_feeds.example.txt:/app/feeds/rss_feeds.txt:ro

  # ── On-demand backup (profile: backup) — writes into the same host-visible data dir ────────────────
  backup:
    environment:
      RWE_DB_URL: ${RWE_DB_URL:-sqlite:////app/data/ih_beta.db}
    volumes: !override
      - ${IH_DATA_DIR:-/opt/ih/data}:/app/data

  # ── Recurring backups (profile: scheduler) — local retention + optional off-host shipment ──────────
  backup-scheduler:
    environment:
      RWE_DB_URL: ${RWE_DB_URL:-sqlite:////app/data/ih_beta.db}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-3600}
      BACKUP_KEEP: ${BACKUP_KEEP:-48}
      # Off-host shipment runs inside the container with the backup file as "$1". For AWS we ship from the
      # HOST instead (deploy/ops/backup.sh cron or `aws s3 sync` — see the runbook) so no AWS CLI is added
      # to the image and the instance IAM role supplies credentials. Set this only if you prefer the
      # in-container path AND add an AWS CLI / rclone to the image.
      BACKUP_OFFHOST_CMD: ${BACKUP_OFFHOST_CMD:-}
    volumes: !override
      - ${IH_DATA_DIR:-/opt/ih/data}:/app/data

volumes:
  caddy_data:      # persisted Let's Encrypt certificates
  caddy_config:
